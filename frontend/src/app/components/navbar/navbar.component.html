<header class="navbar">

  <a
    routerLink="/dashboard"
    class="brand"
  >
    <span class="brand-icon">
      📝
    </span>

    Smart Web Notes
  </a>


  <!-- SEARCH -->
  <form
    class="navbar-search"
    role="search"
  >

    <input
      class="form-control"
      type="search"
      placeholder="Search notes..."
      aria-label="Search notes"
    />

    <button
      class="btn-search"
      type="submit"
    >
      Search
    </button>

  </form>


  <!-- RIGHT SIDE -->
  <div class="actions">

    <a
      routerLink="/notes/new"
      class="btn-primary"
    >
      + New Note
    </a>

  </div>

</header>
