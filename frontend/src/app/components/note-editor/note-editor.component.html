<div class="editor">

  <input
    class="title-input"
    type="text"
    placeholder="Note title"
    [ngModel]="title()"
    (ngModelChange)="onTitleInput($event)"
  />

  <!-- =========================================
       NORMAL TEXT TOOLBAR
  ========================================== -->
  <div class="toolbar">

    <button
      type="button"
      [class.active]="isActive('bold')"
      (click)="cmd('bold')"
      title="Bold (Ctrl+B)"
    >
      <b>B</b>
    </button>

    <button
      type="button"
      [class.active]="isActive('italic')"
      (click)="cmd('italic')"
      title="Italic (Ctrl+I)"
    >
      <i>I</i>
    </button>

    <button
      type="button"
      [class.active]="isActive('underline')"
      (click)="cmd('underline')"
      title="Underline (Ctrl+U)"
    >
      <u>U</u>
    </button>

    <span class="sep"></span>

    <button
      type="button"
      [class.active]="isActive('heading', { level: 1 })"
      (click)="cmd('h1')"
    >
      H1
    </button>

    <button
      type="button"
      [class.active]="isActive('heading', { level: 2 })"
      (click)="cmd('h2')"
    >
      H2
    </button>

    <span class="sep"></span>

    <button
      type="button"
      [class.active]="isActive('bulletList')"
      (click)="cmd('bullet')"
    >
      • List
    </button>

    <button
      type="button"
      [class.active]="isActive('orderedList')"
      (click)="cmd('ordered')"
    >
      1. List
    </button>

    <span class="sep"></span>

    <button
      type="button"
      [class.active]="isActive('link')"
      (click)="cmd('link')"
    >
      Link
    </button>

    <button
      type="button"
      [class.active]="isActive('codeBlock')"
      (click)="cmd('code')"
    >
      Code
    </button>

    <button
      type="button"
      (click)="cmd('table')"
    >
      Table
    </button>

    <span class="sep"></span>

    <button
      type="button"
      (click)="cmd('undo')"
    >
      ↩
    </button>

    <button
      type="button"
      (click)="cmd('redo')"
    >
      ↪
    </button>

    @if (uploading()) {
      <span class="upload-hint">
        Uploading image...
      </span>
    }

  </div>


  <!-- =========================================
       PICTURE TOOLS
       MUST BE BEFORE editor-body
  ========================================== -->
  @if (imageSelected()) {

   <div
  class="picture-tools"
  (mousedown)="$event.preventDefault()"
>

      <div class="picture-tools-title">
        <span>PICTURE TOOLS</span>
        <strong>FORMAT</strong>
      </div>

      <div class="picture-tools-content">

        <!-- PICTURE STYLES -->
        <div class="picture-group">

          <div class="picture-style-list">

          <div class="picture-style-list">

  <button
    type="button"
    class="picture-style"
    [class.active]="isPictureStyle('normal')"
    (click)="setPictureStyle('normal')"
    title="Normal"
  >
    <span class="style-preview preview-normal">
      <span class="preview-sun"></span>
      <span class="preview-mountain"></span>
    </span>
  </button>

  <button
    type="button"
    class="picture-style"
    [class.active]="isPictureStyle('border')"
    (click)="setPictureStyle('border')"
    title="Border"
  >
    <span class="style-preview preview-border">
      <span class="preview-sun"></span>
      <span class="preview-mountain"></span>
    </span>
  </button>

  <button
    type="button"
    class="picture-style"
    [class.active]="isPictureStyle('shadow')"
    (click)="setPictureStyle('shadow')"
    title="Shadow"
  >
    <span class="style-preview preview-shadow">
      <span class="preview-sun"></span>
      <span class="preview-mountain"></span>
    </span>
  </button>

  <button
    type="button"
    class="picture-style"
    [class.active]="isPictureStyle('rounded')"
    (click)="setPictureStyle('rounded')"
    title="Rounded"
  >
    <span class="style-preview preview-rounded">
      <span class="preview-sun"></span>
      <span class="preview-mountain"></span>
    </span>
  </button>

  <button
    type="button"
    class="picture-style"
    [class.active]="isPictureStyle('frame')"
    (click)="setPictureStyle('frame')"
    title="Frame"
  >
    <span class="style-preview preview-frame">
      <span class="preview-sun"></span>
      <span class="preview-mountain"></span>
    </span>
  </button>

</div>

          </div>

          <div class="picture-group-name">
            Picture Styles
          </div>

        </div>


        <span class="picture-separator"></span>


        <!-- ARRANGE -->
        <div class="picture-group">

          <div class="picture-buttons">

        <button
  type="button"
  [class.active]="isImageAlign('left')"
  (click)="setImageAlign('left')"
  title="Align Left"
>
  ← Left
</button>

<button
  type="button"
  [class.active]="isImageAlign('center')"
  (click)="setImageAlign('center')"
  title="Align Center"
>
  Center
</button>

<button
  type="button"
  [class.active]="isImageAlign('right')"
  (click)="setImageAlign('right')"
  title="Align Right"
>
  Right →
</button>

            <button type="button">
              ↑ Up
            </button>

            <button type="button">
              ↓ Down
            </button>

          </div>

          <div class="picture-group-name">
            Arrange
          </div>

        </div>


        <span class="picture-separator"></span>


        <!-- SIZE -->
        <div class="picture-group">

          <div class="picture-buttons">

            <button type="button">
              Reset Size
            </button>

            <button type="button">
              Delete
            </button>

          </div>

          <div class="picture-group-name">
            Size
          </div>

        </div>

      </div>

    </div>

  }


  <!-- =========================================
       EDITOR CONTENT
       MUST COME LAST
  ========================================== -->
  <div class="editor-body">

    <tiptap-editor
      [editor]="editor"
      class="tiptap-surface"
    >
    </tiptap-editor>

  </div>

</div>
