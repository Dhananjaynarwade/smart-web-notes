<div class="editor">

  <!-- =========================================
       NOTE TITLE
  ========================================== -->

  <input
    class="title-input"
    type="text"
    placeholder="Note title"
    [ngModel]="title()"
    (ngModelChange)="onTitleInput($event)"
  />


  <!-- =========================================
       NORMAL TEXT TOOLBAR
  ========================================== -->

  <div class="toolbar-wrapper">

    <div
      class="toolbar"
      role="toolbar"
      aria-label="Note formatting toolbar"
    >

      <!-- TEXT STYLE -->

      <div class="toolbar-group">

        <button
          type="button"
          [class.active]="isActive('bold')"
          (click)="cmd('bold')"
          title="Bold (Ctrl+B)"
        >
          <b>B</b>
        </button>


        <button
          type="button"
          [class.active]="isActive('italic')"
          (click)="cmd('italic')"
          title="Italic (Ctrl+I)"
        >
          <i>I</i>
        </button>


        <button
          type="button"
          [class.active]="isActive('underline')"
          (click)="cmd('underline')"
          title="Underline (Ctrl+U)"
        >
          <u>U</u>
        </button>

      </div>


      <span class="sep"></span>


      <!-- HEADINGS -->

      <div class="toolbar-group">

        <button
          type="button"
          [class.active]="
            isActive(
              'heading',
              { level: 1 }
            )
          "
          (click)="cmd('h1')"
          title="Heading 1"
        >
          H1
        </button>


        <button
          type="button"
          [class.active]="
            isActive(
              'heading',
              { level: 2 }
            )
          "
          (click)="cmd('h2')"
          title="Heading 2"
        >
          H2
        </button>

      </div>


      <span class="sep"></span>


      <!-- LISTS -->

      <div class="toolbar-group">

        <button
          type="button"
          [class.active]="
            isActive('bulletList')
          "
          (click)="cmd('bullet')"
          title="Bullet list"
        >
          • List
        </button>


        <button
          type="button"
          [class.active]="
            isActive('orderedList')
          "
          (click)="cmd('ordered')"
          title="Numbered list"
        >
          1. List
        </button>

      </div>


      <span class="sep"></span>


      <!-- INSERT TOOLS -->

      <div class="toolbar-group">

        <button
          type="button"
          [class.active]="isActive('link')"
          (click)="cmd('link')"
          title="Insert link"
        >
          Link
        </button>


        <button
          type="button"
          [class.active]="
            isActive('codeBlock')
          "
          (click)="cmd('code')"
          title="Code block"
        >
          Code
        </button>


        <button
          type="button"
          (click)="cmd('table')"
          title="Insert table"
        >
          Table
        </button>


        <!-- ADD IMAGE -->

        <button
          type="button"
          class="image-upload-btn"
          (click)="imageInput.click()"
          title="Add image or screenshot"
        >
          📷
        </button>


        <input
          #imageInput
          type="file"
          accept="image/*"
          hidden
          (change)="uploadImage($event)"
        />

      </div>


      <span class="sep"></span>


      <!-- HISTORY -->

      <div class="toolbar-group">

        <button
          type="button"
          (click)="cmd('undo')"
          title="Undo"
        >
          ↩
        </button>


        <button
          type="button"
          (click)="cmd('redo')"
          title="Redo"
        >
          ↪
        </button>

      </div>


      @if (uploading()) {

        <span class="upload-hint">
          Uploading image...
        </span>

      }

    </div>

  </div>


  <!-- =========================================
       PICTURE TOOLS
  ========================================== -->

  @if (imageSelected()) {

    <div
      class="picture-tools"
      (mousedown)="$event.preventDefault()"
    >

      <div class="picture-tools-title">

        <span>
          PICTURE TOOLS
        </span>

        <strong>
          FORMAT
        </strong>

      </div>


      <div class="picture-tools-scroll">

        <div class="picture-tools-content">


          <!-- =====================================
               PICTURE STYLES
          ====================================== -->

          <div class="picture-group">

            <div class="picture-style-list">


              <button
                type="button"
                class="picture-style"
                [class.active]="
                  isPictureStyle('normal')
                "
                (click)="
                  setPictureStyle('normal')
                "
                title="Normal"
              >

                <span
                  class="
                    style-preview
                    preview-normal
                  "
                >
                  <span
                    class="preview-sun"
                  ></span>

                  <span
                    class="preview-mountain"
                  ></span>
                </span>

              </button>


              <button
                type="button"
                class="picture-style"
                [class.active]="
                  isPictureStyle('border')
                "
                (click)="
                  setPictureStyle('border')
                "
                title="Border"
              >

                <span
                  class="
                    style-preview
                    preview-border
                  "
                >
                  <span
                    class="preview-sun"
                  ></span>

                  <span
                    class="preview-mountain"
                  ></span>
                </span>

              </button>


              <button
                type="button"
                class="picture-style"
                [class.active]="
                  isPictureStyle('shadow')
                "
                (click)="
                  setPictureStyle('shadow')
                "
                title="Shadow"
              >

                <span
                  class="
                    style-preview
                    preview-shadow
                  "
                >
                  <span
                    class="preview-sun"
                  ></span>

                  <span
                    class="preview-mountain"
                  ></span>
                </span>

              </button>


              <button
                type="button"
                class="picture-style"
                [class.active]="
                  isPictureStyle('rounded')
                "
                (click)="
                  setPictureStyle('rounded')
                "
                title="Rounded"
              >

                <span
                  class="
                    style-preview
                    preview-rounded
                  "
                >
                  <span
                    class="preview-sun"
                  ></span>

                  <span
                    class="preview-mountain"
                  ></span>
                </span>

              </button>


              <button
                type="button"
                class="picture-style"
                [class.active]="
                  isPictureStyle('frame')
                "
                (click)="
                  setPictureStyle('frame')
                "
                title="Frame"
              >

                <span
                  class="
                    style-preview
                    preview-frame
                  "
                >
                  <span
                    class="preview-sun"
                  ></span>

                  <span
                    class="preview-mountain"
                  ></span>
                </span>

              </button>

            </div>


            <div class="picture-group-name">
              Picture Styles
            </div>

          </div>


          <span
            class="picture-separator"
          ></span>


          <!-- =====================================
               ARRANGE
          ====================================== -->

          <div class="picture-group">

            <div class="picture-buttons">

              <button
                type="button"
                [class.active]="
                  isImageAlign('left')
                "
                (click)="
                  setImageAlign('left')
                "
                title="Align Left"
              >
                ← Left
              </button>


              <button
                type="button"
                [class.active]="
                  isImageAlign('center')
                "
                (click)="
                  setImageAlign('center')
                "
                title="Align Center"
              >
                Center
              </button>


              <button
                type="button"
                [class.active]="
                  isImageAlign('right')
                "
                (click)="
                  setImageAlign('right')
                "
                title="Align Right"
              >
                Right →
              </button>


              <button
                type="button"
                title="Move image up"
              >
                ↑ Up
              </button>


              <button
                type="button"
                title="Move image down"
              >
                ↓ Down
              </button>

            </div>


            <div class="picture-group-name">
              Arrange
            </div>

          </div>


          <span
            class="picture-separator"
          ></span>


          <!-- =====================================
               SIZE
          ====================================== -->

          <div class="picture-group">

            <div class="picture-buttons">

              <button
                type="button"
                title="Reset image size"
              >
                Reset Size
              </button>


              <button
                type="button"
                title="Delete image"
              >
                Delete
              </button>

            </div>


            <div class="picture-group-name">
              Size
            </div>

          </div>

        </div>

      </div>

    </div>

  }


  <!-- =========================================
       EDITOR CONTENT
  ========================================== -->

  <div class="editor-body">

    <tiptap-editor
      [editor]="editor"
      class="tiptap-surface"
    >
    </tiptap-editor>

  </div>

</div>
